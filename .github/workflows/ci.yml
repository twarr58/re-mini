name: Build, Test & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish again (e.g. v0.2.0)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ !inputs.tag && !startsWith(github.ref, 'refs/tags/') }}

env:
  APP_NAME: ReMini
  # release tag being built: an explicit input, or the tag the run was started on
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: Build
    # NSGlassEffectView requires the macOS 26 SDK
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Determine version
        id: version
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -n "$RELEASE_TAG" ]]; then
            # v1.2.3, v1.2.3-rc.1, and older component tags like ReMini-v0.1.0
            if [[ ! "$RELEASE_TAG" =~ (^|-)v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::Tag $RELEASE_TAG is not a release tag (vX.Y.Z)"
              exit 1
            fi
            VERSION="${BASH_REMATCH[2]}"
            if [[ "$VERSION" != "$FILE_VERSION" ]]; then
              echo "::error::Tag $RELEASE_TAG does not match VERSION file ($FILE_VERSION). Releases are tagged by release-please."
              exit 1
            fi
          else
            VERSION="${FILE_VERSION}-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          # same VERSION/BUILD for every make call in this job, otherwise make
          # regenerates Info.plist and breaks the signature
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version

      - name: Unit tests
        run: make test

      - name: Build app bundle
        run: make app

      - name: Static checks
        run: make check

      - name: Package (zip)
        id: package
        run: |
          ZIP="${APP_NAME}-${VERSION}-macos-$(uname -m).zip"
          ZIP="${ZIP//+/_}"
          make zip ZIP="$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    needs: build
    runs-on: macos-26
    env:
      ZIP: ${{ needs.build.outputs.zip }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app

      - name: Verify checksum
        run: shasum -a 256 -c "$ZIP.sha256"

      - name: Unpack
        run: ditto -x -k "$ZIP" .

      - name: Bundle structure
        run: |
          set -x
          test -x "$APP_NAME.app/Contents/MacOS/$APP_NAME"
          test -f "$APP_NAME.app/Contents/Resources/AppIcon.icns"
          test -f "$APP_NAME.app/Contents/Info.plist"

      - name: Info.plist
        run: |
          PLIST="$APP_NAME.app/Contents/Info.plist"
          plutil -lint "$PLIST"
          check() {
            actual=$(/usr/libexec/PlistBuddy -c "Print :$1" "$PLIST")
            echo "$1 = $actual"
            [ "$actual" = "$2" ] || { echo "::error::$1 expected '$2', got '$actual'"; exit 1; }
          }
          check CFBundleIdentifier local.remini
          check CFBundleExecutable "$APP_NAME"
          check CFBundlePackageType APPL
          check CFBundleShortVersionString "$VERSION"

      - name: Binary & code signature
        run: |
          BIN="$APP_NAME.app/Contents/MacOS/$APP_NAME"
          file "$BIN"
          lipo -info "$BIN"
          otool -L "$BIN" | grep -q AppKit.framework
          otool -L "$BIN" | grep -q WebKit.framework
          codesign --verify --deep --strict --verbose=2 "$APP_NAME.app"
          codesign -dv "$APP_NAME.app" 2>&1

      - name: Smoke test (launches and stays alive)
        timeout-minutes: 2
        run: |
          "./$APP_NAME.app/Contents/MacOS/$APP_NAME" > app.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::App exited during startup"
            cat app.log
            exit 1
          fi
          kill "$PID" || true
          echo "App started and ran for 10s without crashing"

  publish:
    name: Publish
    needs: [build, test]
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release
      packages: write   # ghcr.io package
    env:
      ZIP: ${{ needs.build.outputs.zip }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app

      - uses: oras-project/setup-oras@v2

      - name: Push app to GitHub Packages (ghcr.io)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${APP_NAME,,}"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras push "$IMAGE:$VERSION" \
            --artifact-type application/vnd.remini.macos-app \
            --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.description=ReMini macOS app bundle (zip)" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$ZIP:application/zip" \
            "$ZIP.sha256:text/plain"
          # prereleases (v1.2.0-rc.1) do not move "latest"
          [[ "$VERSION" == *-* ]] || oras tag "$IMAGE:$VERSION" latest
          {
            echo "### 📦 Package published"
            echo '```bash'
            echo "oras pull $IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # release-please already created the release (with changelog) -> just attach assets.
      # For a manually pushed tag, create the release here.
      - name: Attach app to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            PRE=""; [[ "$VERSION" == *-* ]] && PRE="--prerelease"
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "$APP_NAME $VERSION" --generate-notes --verify-tag $PRE
          fi
